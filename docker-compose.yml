networks:
  infra:
    external: true

volumes:
  cyberham_data:
  decrypted_secrets:
    external: true

services:
  cyberham:
    image: $REGISTRY_URI/cyberham:latest
    container_name: cyberham
    restart: unless-stopped
    networks:
      - infra
    environment:
      GOATCOUNTER_URL: ${GOATCOUNTER_URL:-}
      GOATCOUNTER_API_TOKEN: ${GOATCOUNTER_API_TOKEN:-}
    volumes:
      - cyberham_data:/app/data
      - type: volume
        source: decrypted_secrets
        target: /app/secrets
        read_only: true
        volume:
          subpath: cyberham
