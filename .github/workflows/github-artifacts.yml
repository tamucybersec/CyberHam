name: CyberHam GHCR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tamucybersec/cyberham

jobs:
  cyberham:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt secrets
        run: decrypt cyberham

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check --diff

      - name: Lint repo
        run: uv run ruff check --output-format=github

      - name: Typecheck repo
        run: uv run pyright --level error

      - name: Stage secrets
        run: |
          mkdir -p secrets
          cp -a /decrypted_secrets/cyberham/. secrets/

      - name: Run tests
        env:
          CYBERHAM_ENV: dev
        run: uv run python -m pytest

      - name: Unstage secrets
        if: always()
        run: rm -rf secrets

      - name: Build image
        run: docker build --pull -t $IMAGE:${{ github.sha }} .

      # - name: Scan image
      #   run: scan $IMAGE:${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        if: github.event_name == 'push'
        run: docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
