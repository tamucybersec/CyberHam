name: CyberHam GHCR Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tamucybersec/cyberham

jobs:
  cyberham:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t $IMAGE:${{ github.sha }} .

      # - name: Scan image
      #   run: scan $IMAGE:${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        if: github.event_name == 'push'
        run: docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
